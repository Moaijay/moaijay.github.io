<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moaijay</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 12vh 24px;
    font: 16px/1.8 -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    max-width: 34rem;
    margin-inline: auto;
  }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p.role { margin: 0 0 2rem; opacity: .7; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: .5rem 0; border-top: 1px solid rgba(128,128,128,.25); }
  a { color: inherit; }
  .sub { opacity: .6; font-size: .9rem; }
  h2 { font-size: .9rem; font-weight: 600; opacity: .6; margin: 2.5rem 0 .5rem; }
</style>
</head>
<body>
  <h1>Moaijay</h1>
  <p class="role">iOS App 開發者</p>
  <ul>
    <li>
      <a href="https://apps.apple.com/tw/app/id6790771252">數水餃</a>
      <span class="sub">— <a href="https://moaijay.github.io/dumplings-support/">支援與隱私政策</a></span>
    </li>
  </ul>

  <h2>網頁</h2>
  <ul>
    <li>
      <a href="https://fable-lab.moaijay.workers.dev/ascent/">升空</a>
      <span class="sub">— 從海面一鏡到底升到地球同步軌道</span>
    </li>
    <li>
      <a href="https://fable-lab.moaijay.workers.dev/wind-tunnel/">數位風洞</a>
      <span class="sub">— 在顯示卡上算有黏性的氣流，看機翼怎麼失速</span>
    </li>
    <li>
      <a href="https://fable-lab.moaijay.workers.dev/airfoil-lab/">翼型風洞</a>
      <span class="sub">— 調翼型、攻角、襟翼，即時看壓力分布</span>
    </li>
    <li>
      <a href="https://fable-lab.moaijay.workers.dev/truss-lab/">桁架實驗室</a>
      <span class="sub">— 車開過橋，每根桿件受多少力</span>
    </li>
    <li>
      <a href="https://fable-lab.moaijay.workers.dev/boring-daily/">無聊日報</a>
      <span class="sub">— 報導一切不值得報導的事</span>
    </li>
  </ul>
</body>
</html>
